<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Linkding Settings</title>
    <link rel="stylesheet" href="options.css" />
  </head>
  <body>
    <main>
      <h1>Linkding Settings</h1>

      <form id="options-form">
        <label>
          Linkding URL
          <input id="baseUrl" type="url" placeholder="https://linkding.zisoft.de" required />
        </label>

        <label>
          API Token
          <input id="apiToken" type="password" placeholder="Token" required />
        </label>

        <label class="checkbox-row">
          <input id="autoCloseOnSuccess" type="checkbox" />
Automatically close popup after successful save
        </label>

        <button type="submit">Save settings</button>
      </form>

      <p id="status" role="status" aria-live="polite"></p>
    </main>

    <script src="options.js"></script>
  </body>
</html>
