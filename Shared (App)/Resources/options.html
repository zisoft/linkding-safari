<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Linkding Settings</title>
    <link rel="stylesheet" href="options.css" />
  </head>
  <body>
    <main>
      <h1>Linkding Settings</h1>

      <form id="options-form">
        <label>
          Linkding URL
          <input id="baseUrl" type="url" placeholder="https://linkding.example.com" required />
        </label>

        <label>
          API Token
          <input id="apiToken" type="password" placeholder="Token" required />
        </label>

        <label>
          Default Tags
          <input id="tags" type="text" placeholder="" />
        </label>

        <label class="checkbox-row">
          <input id="unreadDefault" type="checkbox" />
          Pre-select unread when adding bookmark
        </label>

        <label class="checkbox-row">
          <input id="sharedDefault" type="checkbox" />
          Pre-select share when adding bookmark
        </label>

        <label class="checkbox-row">
          <input id="autoCloseOnSuccess" type="checkbox" />
          Automatically close popup after successful save
        </label>

        <div class="actions">
          <button type="submit">Save settings</button>
          <div id="status" role="status" aria-live="polite"></div>
        </div>
      </form>

    </main>

    <script src="options.js"></script>
  </body>
</html>
