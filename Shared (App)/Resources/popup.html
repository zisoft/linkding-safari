<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Save to Linkding</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <main>
      <div class="title-row">
        <h1 class="title-brand">
		  <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-paperclip preview-icon"><path d="m16 6-8.414 8.586a2 2 0 0 0 2.829 2.829l8.414-8.586a4 4 0 1 0-5.657-5.657l-8.379 8.551a6 6 0 1 0 8.485 8.485l8.379-8.551"/></svg>
          <span>Linkding</span>
        </h1>
        <div class="title-actions">
          <button id="openSettings" class="icon-button" type="button" title="Settings">
            <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9.671 4.136a2.34 2.34 0 0 1 4.659 0 2.34 2.34 0 0 0 3.319 1.915 2.34 2.34 0 0 1 2.33 4.033 2.34 2.34 0 0 0 0 3.831 2.34 2.34 0 0 1-2.33 4.033 2.34 2.34 0 0 0-3.319 1.915 2.34 2.34 0 0 1-4.659 0 2.34 2.34 0 0 0-3.32-1.915 2.34 2.34 0 0 1-2.33-4.033 2.34 2.34 0 0 0 0-3.831A2.34 2.34 0 0 1 6.35 6.051a2.34 2.34 0 0 0 3.319-1.915"/><circle cx="12" cy="12" r="3"/></svg>
          </button>
          <button id="openInstance" class="icon-button" type="button" title="Open Linkding">
            <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 3h6v6"/><path d="M10 14 21 3"/><path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"/></svg>
          </button>
        </div>
      </div>

      <form id="bookmark-form">
        <label>
          URL
          <input id="url" type="url" required />
          <p id="duplicateHint" class="duplicate-hint" hidden>
            This URL is already bookmarked. The form has been prefilled from the existing bookmark, and saving the form will update the existing bookmark.
          </p>
        </label>

        <label class="tags-field">
          Tags (space-separated)
          <input id="tags" type="text" placeholder="e.g. safari reading" autocomplete="off" />
          <ul id="tagSuggestions" class="tag-suggestions" role="listbox" hidden></ul>
        </label>

        <label>
          Title
          <input id="title" type="text" required />
        </label>

        <label>
          Description
          <textarea id="description" rows="3" placeholder="Optional"></textarea>
        </label>

        <label>
          Notes
          <textarea id="notes" rows="3" placeholder="Optional"></textarea>
        </label>

        <label class="checkbox-row">
          <input id="unread" type="checkbox" />
          Mark as unread
        </label>

        <div class="actions">
          <button id="deleteBookmark" type="button" class="icon-button danger" title="Delete bookmark" disabled>
            <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M10 11v6"/><path d="M14 11v6"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6"/><path d="M3 6h18"/><path d="M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/></svg>
          </button>
		  <div id="status" role="status" aria-live="polite"></div>
          <button id="save" type="submit">Save</button>
        </div>
      </form>

    </main>

    <script src="popup.js"></script>
  </body>
</html>
