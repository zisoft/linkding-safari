<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Save to Linkding</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <main>
      <h1 class="title-row">
        <img src="icon-32.png" alt="" width="18" height="18" />
        <span>Linkding</span>
      </h1>

      <form id="bookmark-form">
        <label>
          Title
          <input id="title" type="text" required />
        </label>

        <label>
          URL
          <input id="url" type="url" required />
        </label>

        <label>
          Description
          <textarea id="description" rows="3" placeholder="Optional"></textarea>
        </label>

        <label>
          Notes
          <textarea id="notes" rows="3" placeholder="Optional"></textarea>
        </label>

        <label>
          Tags (comma-separated)
          <input id="tags" type="text" placeholder="e.g. safari,reading" />
          <div id="tagSuggestions" class="tag-suggestions" aria-live="polite"></div>
        </label>

        <div class="actions">
          <a class="settings-link" href="options.html" target="_blank" rel="noreferrer">Settings</a>
          <button id="save" type="submit">Save bookmark</button>
        </div>
      </form>

      <p id="status" role="status" aria-live="polite"></p>
    </main>

    <script src="popup.js"></script>
  </body>
</html>
